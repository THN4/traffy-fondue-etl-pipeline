services:
  postgres:
    image: postgres:16-alpine
    container_name: traffy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-traffy_fondue}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-traffy_fondue}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffy-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: traffy_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - traffy-network
  
  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: traffy_airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False  
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Bangkok 
      - PYTHONPATH=/opt/airflow  
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8088:8080"
    volumes:
      - ./dags:/opt/airflow/dags        # ผูกโฟลเดอร์ dags ในเครื่องเข้ากับ Airflow
      - ./scripts:/opt/airflow/scripts  # ผูกโฟลเดอร์ scripts เพื่อให้ DAG ดึงฟังก์ชันไปรันได้
      - ./sql:/opt/airflow/sql
      - ./.env:/opt/airflow/.env
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traffy-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  traffy-network:
    driver: bridge
